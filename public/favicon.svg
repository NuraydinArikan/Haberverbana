<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Vibrant High-Contrast Red Gradient -->
    <linearGradient id="redBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="60%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <!-- Radar Scanner Sweep Gradient -->
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="60%" stop-color="#FCA5A5" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#34D399" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- High-contrast rounded badge -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#redBadge)" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.4" />

  <!-- 3 Pure White High-Contrast Radar Rings (Distinct & Legible at 16x16) -->
  <circle cx="32" cy="32" r="23" stroke="#FFFFFF" stroke-width="2.2" stroke-opacity="0.9" />
  <circle cx="32" cy="32" r="15" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.85" />
  <circle cx="32" cy="32" r="7.5" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.85" />

  <!-- High-Contrast Radar Crosshairs -->
  <line x1="32" y1="7" x2="32" y2="57" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.8" stroke-linecap="round" />
  <line x1="7" y1="32" x2="57" y2="32" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.8" stroke-linecap="round" />

  <!-- Rotating Radar Beam (SVG Hardware-Accelerated Animation) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="3s" repeatCount="indefinite" />
    <!-- Light Sweep Wedge -->
    <path d="M 32 32 L 48 16 A 23 23 0 0 1 55 32 Z" fill="url(#radarSweep)" />
    <!-- Bright Leading Beam -->
    <line x1="32" y1="32" x2="48.5" y2="15.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- Center Pivot Core -->
  <circle cx="32" cy="32" r="3.2" fill="#FFFFFF" />

  <!-- Detected Deal Blip: Glowing Emerald/Cyan Dot at 2 o'clock -->
  <g filter="url(#glow)">
    <circle cx="44" cy="20" r="4.2" fill="#10B981" />
    <circle cx="44" cy="20" r="1.8" fill="#FFFFFF" />
  </g>
</svg>
